<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catxpo</title>
<meta name="description" content="Catxpo : calendrier des expositions félines TICA pour Maine Coon polydactyle, distances, itinéraires et planning.">
<meta name="theme-color" content="#1f8a76">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catxpo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout : app shell — barre du haut, écran central qui défile, barre d'onglets en bas (rail à gauche sur grand écran), fiche en panneau glissant */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface2:#f6f8f6; --fg:#1b2a26; --muted:#5b6b66; --line:#d8e0dc;
  --forest:#1f4d43; --forest-ink:#ffffff; --amber:#a86f08; --amber-soft:#fbefd6;
  --ok:#1d7a52; --ok-soft:#dcf1e6; --no:#a23b2c; --no-soft:#f7e3df; --shadow:0 10px 30px rgba(20,40,35,.16);
  --be:#d39b00; --fr:#2f62d6; --nl:#ef6c12; --de:#cf2f3c; --uk:#7b45c9; --ot:#159a8c;
  --t-home:#159a8c; --t-cal:#e8505b; --t-exp:#2f62d6; --t-plan:#e09a12;
  --hero:linear-gradient(135deg,#17443b 0%,#1f8a76 48%,#f0a33a 100%);
  --tint:color-mix(in srgb,var(--k,#159a8c) 13%,var(--surface));
  --display:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive,sans-serif;
  --body:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive,sans-serif;
  --mono:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#17211e; --surface2:#1c2824; --fg:#e4ece8; --muted:#97a8a2; --line:#2b3a35;
  --forest:#7cc3b0; --forest-ink:#0e1513; --amber:#f0b84a; --amber-soft:#3a2e14;
  --ok:#6fd3a3; --ok-soft:#173a2b; --no:#f08a78; --no-soft:#3b1f1a; --shadow:0 10px 30px rgba(0,0,0,.5); --be:#f2c23c; --fr:#7d9ef5; --nl:#ff9a52; --de:#f2707a; --uk:#b48cf0; --ot:#4fd1c0; --t-home:#4fd1c0; --t-cal:#ff7d86; --t-exp:#7d9ef5; --t-plan:#f2c23c; --hero:linear-gradient(135deg,#123a33 0%,#1b6f60 50%,#a8701c 100%); --tint:color-mix(in srgb,var(--k,#4fd1c0) 18%,var(--surface)); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17211e; --surface2:#1c2824; --fg:#e4ece8; --muted:#97a8a2; --line:#2b3a35;
  --forest:#7cc3b0; --forest-ink:#0e1513; --amber:#f0b84a; --amber-soft:#3a2e14;
  --ok:#6fd3a3; --ok-soft:#173a2b; --no:#f08a78; --no-soft:#3b1f1a; --shadow:0 10px 30px rgba(0,0,0,.5); --be:#f2c23c; --fr:#7d9ef5; --nl:#ff9a52; --de:#f2707a; --uk:#b48cf0; --ot:#4fd1c0; --t-home:#4fd1c0; --t-cal:#ff7d86; --t-exp:#7d9ef5; --t-plan:#f2c23c; --hero:linear-gradient(135deg,#123a33 0%,#1b6f60 50%,#a8701c 100%); --tint:color-mix(in srgb,var(--k,#4fd1c0) 18%,var(--surface)); color-scheme:dark}
[hidden]{display:none!important}
[class*="k-"],.stat{--tint:color-mix(in srgb,var(--k) 15%,var(--surface))}
.k-be{--k:var(--be)}.k-fr{--k:var(--fr)}.k-nl{--k:var(--nl)}.k-de{--k:var(--de)}.k-uk{--k:var(--uk)}.k-ot{--k:var(--ot)}
.cc{display:inline-grid;place-items:center;min-width:26px;height:18px;border-radius:5px;background:var(--k);color:#fff;font:700 .62rem var(--mono);letter-spacing:.04em;padding:0 4px;vertical-align:1px}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 100% -10%,color-mix(in srgb,var(--t-plan) 14%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 0%,color-mix(in srgb,var(--t-home) 14%,transparent),transparent 60%),var(--bg);color:var(--fg);font:15px/1.5 var(--body);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--hero);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand b{font:800 1.08rem/1.1 var(--display);display:block}
.brand small{font:500 .68rem var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.home{cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.8rem;font-family:var(--body);}
.home svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.home{color:var(--t-home);border:1px solid color-mix(in srgb,var(--t-home) 45%,transparent);background:color-mix(in srgb,var(--t-home) 10%,transparent);border-radius:99px;padding:4px 10px;white-space:nowrap}
main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.v-home{--acc:var(--t-home)}.screen.v-cal{--acc:var(--t-cal)}.screen.v-explore{--acc:var(--t-exp)}.screen.v-plan{--acc:var(--t-plan)}
.screen>div>h2::after,.screen>h2::after{content:"";display:block;width:36px;height:4px;border-radius:99px;background:var(--acc);margin-top:6px}
.screen{max-width:880px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
h2{font:700 1.35rem/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 1rem/1.25 var(--display);margin:0}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sect span,.muted{color:var(--muted);font-size:.88rem}
.mono{font-family:var(--mono)}
/* tabbar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{background:none;border:0;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[data-v="home"]{--tc:var(--t-home)}.tabbar button[data-v="cal"]{--tc:var(--t-cal)}.tabbar button[data-v="explore"]{--tc:var(--t-exp)}.tabbar button[data-v="plan"]{--tc:var(--t-plan)}
.tabbar button[aria-current="page"]{color:var(--tc)}
.tabbar button[aria-current="page"] svg{fill:color-mix(in srgb,var(--tc) 22%,transparent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--tc)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:99px;background:var(--amber);color:var(--surface);font:700 .65rem/16px var(--body);padding:0 4px}
@media (min-width:900px){
  .app{grid-template-columns:96px 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:1/3}
  .tabbar{grid-row:2;grid-column:1;grid-template-columns:1fr;align-content:start;border-top:0;border-right:1px solid var(--line);padding-top:10px}
  .tabbar button{padding:12px 4px}
  .tabbar button[aria-current="page"]::before{top:20%;bottom:20%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero{background:var(--hero);color:#fff;box-shadow:0 12px 28px color-mix(in srgb,var(--t-home) 30%,transparent);border:0;border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;cursor:pointer;text-align:left;width:100%}
.hero .eyebrow{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero h2{color:inherit;margin:6px 0 4px;font-size:1.6rem}
.hero p{margin:0;opacity:.9}
.count-big{text-align:right}
.count-big b{font:800 3rem/1 var(--display);display:block;font-variant-numeric:tabular-nums}
.count-big span{font:500 .72rem var(--mono);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat:nth-child(1){--k:var(--t-home)}.stat:nth-child(2){--k:var(--t-exp)}.stat:nth-child(3){--k:var(--t-cal)}.stat:nth-child(4){--k:var(--t-plan)}
.stat{background:var(--tint)!important;border-color:color-mix(in srgb,var(--k) 30%,transparent)!important}
.stat b{font:800 1.4rem/1 var(--display);color:var(--k);font-variant-numeric:tabular-nums;display:block}
.stat span{font-size:.78rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.count-big b{font-size:2.4rem}}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin:0 -16px;padding-inline:16px}
.mini{border-top:5px solid var(--k)!important;background:linear-gradient(180deg,var(--tint),var(--surface) 70%)!important;flex:0 0 190px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left}
.mini .km{font:800 1.5rem/1 var(--display);color:var(--k)}
.mini .km small{font:500 .66rem var(--mono);color:var(--muted);margin-left:3px}
.mini h3{margin-top:8px;font-size:.98rem}
.mini p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0;padding-top:0}
.rk .n{font:800 1.2rem var(--display);color:var(--k);text-align:center}
.rk .bar{height:6px;background:var(--line);border-radius:99px;margin-top:5px;overflow:hidden}
.rk .bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--k) 55%,transparent),var(--k));border-radius:99px}
.rk .v{font:500 .78rem var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.grp{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc,var(--muted));margin:10px 2px 0}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--forest)}
.row{box-shadow:inset 5px 0 0 var(--k)}
.row .dt{background:var(--tint);border-radius:10px;padding:5px 0}
.row.x{opacity:.55}.row.x h3{text-decoration:line-through}
.dt{text-align:center;font-variant-numeric:tabular-nums}
.dt b{font:800 1.25rem/1 var(--display);color:var(--k,var(--forest));display:block}
.dt span{font:500 .66rem var(--mono);color:var(--muted);text-transform:uppercase}
.row .mid{min-width:0}
.row h3{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chip{font:500 .68rem var(--mono);padding:2px 7px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-no{background:var(--no-soft);color:var(--no)}.c-m{background:var(--amber-soft);color:var(--amber)}
.kmv{font:500 .74rem var(--mono);color:var(--muted);white-space:nowrap}
.star{color:var(--amber);font-size:.9rem}
/* filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--fg);padding:11px 0;width:100%;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc,var(--forest));border-color:var(--acc,var(--forest));color:#fff}
.frow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.range{display:flex;align-items:center;gap:10px;flex:1 1 240px}
.range input{flex:1;accent-color:var(--t-exp)}
.range output{font:500 .78rem var(--mono);min-width:76px;text-align:right}
select{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 8px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center;background:var(--surface)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.iconbtn:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font:500 .66rem var(--mono);color:var(--muted);text-align:center;text-transform:uppercase;padding:2px 0}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;padding:0}
.day.out{background:transparent;color:var(--muted);opacity:.4;cursor:default}
.day.today{border-color:var(--t-cal);border-width:2px}
.day.sel{background:var(--t-cal);color:#fff}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dots i{background:var(--k)}
.day.has{background:color-mix(in srgb,var(--t-cal) 9%,var(--surface))}
.day.sel .dots i{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
/* planning */
.pl{display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--t-plan),var(--ok))}
.sync{font:500 .7rem var(--mono);color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;border-radius:22px 22px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:86%}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 0}
.shhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 18px 10px;border-bottom:1px solid var(--line)}
.shhead h2{font-size:1.3rem}
.shbody{overflow-y:auto;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 12px;font-weight:700;font-size:.92rem;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--fg);text-align:center}
.btn.pri{background:var(--k,var(--forest));border-color:var(--k,var(--forest));color:#fff}
.shhead{background:linear-gradient(180deg,var(--tint),var(--surface))}
.sheet .grab{background:var(--k)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status3 button{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 6px;font-weight:700;font-size:.86rem;cursor:pointer}
.status3 button[data-st="interesse"]{--sc:var(--t-exp)}.status3 button[data-st="peutetre"]{--sc:var(--t-plan)}.status3 button[data-st="inscrit"]{--sc:var(--ok)}
.status3 button[aria-pressed="true"]{background:var(--sc);border-color:var(--sc);color:#fff}
.checks{display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:center;padding:7px 2px;cursor:pointer;font-size:.93rem}
.checks input{width:19px;height:19px;accent-color:var(--ok);flex:none}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--fg);font:inherit;padding:10px;resize:vertical;box-sizing:border-box}
.alert{border-radius:12px;padding:10px 12px;font-size:.9rem}
.a-ok{background:var(--ok-soft);color:var(--ok)}.a-no{background:var(--no-soft);color:var(--no)}.a-m{background:var(--amber-soft);color:var(--amber)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.88rem;z-index:30;box-shadow:var(--shadow)}
.foot{font-size:.78rem;color:var(--muted)}
.remind{background:color-mix(in srgb,var(--t-plan) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--t-plan) 40%,transparent);border-radius:16px;padding:14px}
.rline{margin:8px 0 0;font-size:.85rem;color:var(--muted)}.rline:empty{display:none}
.accs{display:flex;flex-direction:column;gap:6px}
.acc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer}
.acc input{width:18px;height:18px;accent-color:var(--t-home);flex:none}.acc span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.acc:has(input:checked){border-color:var(--t-home);background:var(--tint)}
.warn{color:var(--no)}
.homef{display:flex;flex-direction:column;gap:8px;margin-top:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
.homef label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);flex:1;min-width:0}
.homef label.sm{flex:0 0 32%}
.homef input,.homef select{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-size:.95rem;padding:9px;min-width:0;width:100%;box-sizing:border-box}
.hrow{display:flex;gap:8px}
.drivebox{display:flex;flex-direction:column;gap:8px;background:var(--tint);border:1px solid color-mix(in srgb,var(--k) 30%,transparent);border-radius:14px;padding:12px}
.drivebox h3{font-size:.95rem}.drivebox label{display:block;font-size:.85rem;margin:2px 0 4px}.drivebox .ok{color:var(--ok)}.drivebox .warn{color:var(--no);font-size:.85rem}.drivebox a{color:var(--k);font-weight:700}
.tinput{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--fg);font:inherit;padding:10px}
.places{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.placelink{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--k,var(--forest));font-weight:700;font-size:.88rem;background:var(--tint);border-radius:10px;padding:7px 10px;min-width:0}
.placelink svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2}.placelink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drivebox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;padding:10px}
.itin{display:flex;flex-direction:column;gap:8px;background:var(--tint);border:1px solid color-mix(in srgb,var(--k) 30%,transparent);border-radius:14px;padding:12px}
.itin h3{font-size:.95rem}
.opt{display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--fg)}
.opt:hover{border-color:var(--k)}.opt b{color:var(--k)}.opt span{font-size:.82rem;color:var(--muted)}
.orig label{display:block;font-size:.85rem;margin:4px 0}
.origrow{display:flex;gap:8px}.origrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;padding:10px}
.origrow .btn{flex:none}.btn[aria-disabled="true"]{opacity:.5}
.addrline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}.addrline a,.linkbtn{font-size:.82rem;font-weight:700;color:var(--k,var(--forest))}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.pin{color:var(--ok);font-weight:700}
.cities{display:flex;flex-direction:column;gap:12px}
.cgrp h3{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.plist{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 12px;cursor:pointer;width:100%}
.pick:hover{border-color:var(--t-home)}.pick span{font-size:.82rem;color:var(--muted)}
#ai{width:100%}

body.standalone .drive-only{display:none!important}
.tabbar{grid-template-columns:repeat(5,1fr)!important}
.tabbar button[data-v="elev"]{--tc:var(--t-elev)}.screen.v-elev{--acc:var(--t-elev)}
:root{--t-elev:#8a4fd6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-elev:#b48cf0}}:root[data-theme="dark"]{--t-elev:#b48cf0}
@media (min-width:900px){.tabbar{grid-template-columns:1fr!important}}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ef label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted);min-width:0}
.ef label.full{grid-column:1/-1}
.ef input,.ef select,.ef textarea{border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--fg);font:inherit;font-size:16px;padding:9px;min-width:0;width:100%;box-sizing:border-box}
.ef .chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.92rem}.ef .chk input{width:19px;height:19px;accent-color:var(--t-elev);flex:none}
.cat{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;box-shadow:inset 5px 0 0 var(--t-elev)}
.cat:hover{border-color:var(--t-elev)}
.cat .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--t-elev) 15%,var(--surface));color:var(--t-elev);font:800 1.1rem var(--display)}
.cat h3{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat .sub{color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-p{background:color-mix(in srgb,var(--t-elev) 15%,var(--surface));color:var(--t-elev)}

.idcard{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--t-elev) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--t-elev) 45%,transparent);border-radius:12px;padding:10px}
.idcard img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:var(--surface2);cursor:zoom-in}
.idcard .row2{display:flex;gap:8px;flex-wrap:wrap}.idcard .row2 .btn{flex:1 1 140px;padding:9px 10px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.ptype{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}.ptype>b{font-size:.82rem;color:var(--muted);font-weight:400}
.ptype .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ptype .opts label{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:9px 11px;cursor:pointer;color:var(--fg);font-size:.92rem;font-weight:700}
.ptype .opts label span{font-size:.78rem;font-weight:400;color:var(--muted)}
.ptype .opts input{position:absolute;opacity:0;pointer-events:none}
.ptype .opts label:has(input:checked){border-color:var(--t-elev);background:color-mix(in srgb,var(--t-elev) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--t-elev)}
.ptype .opts label:has(input:focus-visible){outline:2px solid var(--amber);outline-offset:2px}
.btn.elev{background:var(--t-elev);border-color:var(--t-elev);color:#fff}

.bk h3{font-size:1rem}
html,body{margin:0}.app{height:100vh;height:100dvh}input,select,textarea{font-size:16px}body{-webkit-text-size-adjust:100%}.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
</style>
</head>

let PHOTOS={};
const idb=()=>new Promise((ok,ko)=>{try{const r=indexedDB.open("catxpo",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});
async function photoPut(id,data){PHOTOS[id]=data;try{const d=await idb();await new Promise((ok,ko)=>{const t=d.transaction("photos","readwrite");t.objectStore("photos").put(data,id);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}catch(e){toast("Photo gardée pour cette session seulement (stockage indisponible)")}}
async function photoDel(id){delete PHOTOS[id];try{const d=await idb();d.transaction("photos","readwrite").objectStore("photos").delete(id)}catch(e){}}
(async()=>{try{const d=await idb();const t=d.transaction("photos","readonly").objectStore("photos");const req=t.openCursor();
  req.onsuccess=()=>{const c=req.result;if(c){PHOTOS[c.key]=c.value;c.continue()}else if(view==="elev")render()}}catch(e){}})();
function shrinkImage(file){return new Promise((ok,ko)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1600,s=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
    const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);ok(cv.toDataURL("image/jpeg",.82))};
  im.onerror=()=>{URL.revokeObjectURL(url);ko(new Error("img"))};im.src=url})}
function viewPhoto(src){const v=document.createElement("div");v.className="viewer";v.innerHTML=`<img alt="Carte d'identité">`;v.firstChild.src=src;v.addEventListener("click",()=>v.remove());document.body.appendChild(v)}

const PTYPES=[["std","Chat standard","5 doigts devant, 4 derrière"],["pa","Polydactyle P","Pattes avant"],["pr","Polydactyle P","Pattes arrière"],["pp","Polydactyle PP","Les quatre pattes"]];
const ptLabel=pt=>pt==="pa"?"P avant":pt==="pr"?"P arrière":pt==="pp"?"PP":pt==="p"?"Polydactyle":"Standard";
const CSTAT=[["","—"],["show","Expo"],["repro","Reproducteur"],["chaton","Chaton"],["retraite","Retraité"]];
function ageOf(d){if(!d)return"";const b=new Date(d),t=new Date(TODAY);if(isNaN(b))return"";let m=(t.getFullYear()-b.getFullYear())*12+t.getMonth()-b.getMonth();if(t.getDate()<b.getDate())m--;if(m<0)return"";return m<12?`${m} mois`:`${Math.floor(m/12)} an${m>=24?"s":""}${m%12?` ${m%12} mois`:""}`}

  let h=`<div><h2>Mon élevage</h2><p class="sync" style="margin:4px 0 0">${syncMode==="cloud"?"Synchronisé avec ton compte Claude":"Enregistré sur cet appareil"} · inclus dans « Exporter par mail »</p></div>
  <section class="card"><h3 style="margin-bottom:10px">L'élevage</h3><div class="ef">
  <label class="full">Nom de l'élevage<input data-ef="nom" value="${esc(e.nom)}" placeholder="ex. Les Pattes de Velours"></label>
  <label>Affixe<input data-ef="affixe" value="${esc(e.affixe)}"></label>
  <label>N° d'élevage TICA<input data-ef="tica" value="${esc(e.tica)}"></label>
  <label>Ville<input data-ef="ville" value="${esc(e.ville)}"></label>
  <label>Site ou page<input data-ef="site" value="${esc(e.site)}" inputmode="url"></label></div></section>`;
  const cats=[...e.cats].sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr"));
  h+=`<div><div class="sect"><h3>Mes chats</h3><span>${cats.length} chat${cats.length>1?"s":""}</span></div><div class="list">`;

  cats.forEach(c=>{const sub=[lab(SEXES,c.sexe),ageOf(c.naiss),c.couleur].filter(x=>x&&x!=="—").join(" · ");
    h+=`<button type="button" class="cat" data-cat="${esc(c.id)}"><span class="av">${esc((c.nom||"?").trim().charAt(0).toUpperCase()||"?")}</span><span style="min-width:0"><h3>${esc(c.nom||"Sans nom")}</h3><div class="sub">${esc(sub||"Touche pour compléter la fiche")}</div></span><span class="end" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${c.poly?`<span class="chip c-p">${ptLabel(c.pt)}</span>`:`<span class="chip c-m">Standard</span>`}${PHOTOS[c.id]?`<span class="chip c-ok">Carte d'identité</span>`:""}${c.statut?`<span class="chip c-m">${esc(lab(CSTAT,c.statut))}</span>`:""}</span></button>`});

let CITY=null,cityLoading=null;
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[-'’]/g," ");
function loadCities(){if(cityLoading)return cityLoading;cityLoading=fetch("cities.txt").then(r=>{if(!r.ok)throw 0;return r.text()}).then(tx=>{const L=tx.split("\n");CITY=L.map(l=>{const[n,cc,la,lo,pop]=l.split("|");return{n,cc,la:+la,lo:+lo,pop:+pop,k:norm(n)}});return CITY}).catch(()=>{cityLoading=null;throw 0});return cityLoading}
function searchCities(q){const k=norm(q.trim());if(k.length<2||!CITY)return[];const out=[],sub=[];for(const c of CITY){if(c.k.startsWith(k)){out.push(c);if(out.length>=25)break}else if(sub.length<25&&(" "+c.k).includes(" "+k))sub.push(c)}return out.concat(sub).slice(0,25)}
async function askClaude(q,box){
  box.innerHTML=`<div class="empty">Recherche de « ${esc(q)} » en cours…</div>`;
  try{const sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;
    if(!sample){box.innerHTML=`<div class="empty">La recherche par code postal ou adresse n'est pas disponible ici. Cherche par nom de ville.</div>`;return}

       :c==="server_unavailable"||c==="upstream_error"?"Pas de réponse claire de Google Drive : le document a peut-être été créé. Vérifie ton Drive avant de réessayer."
       :"La sauvegarde n'a pas abouti. Réessaie dans un instant.";
    }
    go.disabled=false;go.textContent="Sauvegarder"});
}
function gcal(s){const b=pd(s.d2);b.setDate(b.getDate()+1);const f=d=>iso(d).replace(/-/g,"");
  const q=new URLSearchParams({action:"TEMPLATE",text:`Expo féline ${s.f} – ${s.cl}`,dates:`${f(pd(s.d1))}/${f(b)}`,location:`${s.l?s.l+", ":""}${s.v}, ${s.p}`,details:s.u||""});
  return "https://calendar.google.com/calendar/render?"+q.toString()}
// ---------- sauvegarde : exporter / importer un fichier ----------
function backupCard(){
  return `<section class="card bk"><h3>Sauvegarde</h3>
  <p class="muted" style="margin:6px 0 10px">Toutes tes infos (planning, checklist, hôtel, notes, élevage et photos, adresse de départ) dans un fichier <b>sauvegarde</b> au format JSON, à garder sur ton Google Drive.</p>
  <div class="actions"><button type="button" class="btn pri" data-bk="export"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>Envoyer vers le Drive</button><button type="button" class="btn" data-bk="import"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 13v7h14v-7"/></svg>Récupérer depuis le Drive</button></div>
  <div id="bkHelp" class="alert a-ok" hidden style="margin-top:8px"></div>
  <input type="file" id="bkFile" accept=".json,.txt,application/json,text/plain,application/octet-stream" hidden>
  <p class="foot" style="margin:8px 0 0">« Récupérer » remplace le planning et l'élevage de cet appareil par ceux du fichier. Sur iPhone, active Drive une fois dans l'app Fichiers (Parcourir › ⋯ › Modifier). · version 24/10</p></section>`;
}
function backupData(){return{app:"Catxpo",format:1,exported:new Date().toISOString(),items:JSON.parse(JSON.stringify(PLAN)),elevage:ELEV,home:HOME,depart:DEP}}
async function exportBackup(){
  const name=`sauvegarde-${TODAY}.json`,full=backupData();{const ph={};(ELEV.cats||[]).forEach(c=>{if(PHOTOS[c.id])ph[c.id]=PHOTOS[c.id]});if(Object.keys(ph).length)full.photos=ph}const txt=JSON.stringify(full,null,2);
  const file=new File([txt],name,{type:"application/json"});
  const help=h=>{const b=$("#bkHelp");if(b){b.innerHTML=h;b.hidden=false}};
  // iPhone (et appareils qui l'acceptent) : menu de partage avec le .json -> choisir Drive
  if(navigator.share){let ok=false;try{ok=navigator.canShare&&navigator.canShare({files:[file]})}catch(e){}
    if(ok){try{await navigator.share({files:[file],title:"Sauvegarde Catxpo"});help(`Dans le menu, choisis <b>Drive</b> (ou « Enregistrer dans Fichiers › Drive ») pour y ranger <b>${esc(name)}</b>.`);return}catch(e){if(e&&e.name==="AbortError")return}}}
  // Android et ordinateur : le .json est téléchargé, puis on l'ajoute au Drive
  let dl=null;
  if(window.claude&&window.claude.use){try{dl=await window.claude.use("downloads")}catch(e){dl=null}}
  if(dl){try{await dl.save({filename:name,data:txt})}catch(e){if(e&&e.code==="declined")return;toast("Enregistrement impossible ici");return}}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  help(`<b>${esc(name)}</b> est dans tes Téléchargements. Pour l'envoyer sur le Drive : ouvre l'app <b>Drive</b>, touche <b>+</b>, puis <b>Importer</b>, et choisis ce fichier. <a href="https://drive.google.com/" target="_blank" rel="noopener">Ouvrir Google Drive</a>`);
  toast("Sauvegarde enregistrée");
}
function cleanItems(o){const out={};if(!o||typeof o!=="object"||Array.isArray(o))return null;
  for(const[k,v]of Object.entries(o)){if(!/^[\w.:@+~-]{1,200}$/.test(k)||!v||typeof v!=="object"||Array.isArray(v))continue;out[k]=JSON.parse(JSON.stringify(v))}return out}
function importBackup(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast("Ce fichier n'est pas une sauvegarde Catxpo");return}
    applyBackup(d)};
  r.readAsText(file);
}
function applyBackup(d){{
    const items=cleanItems(d&&d.items);if(!items||(d.app&&d.app!=="Catxpo")){toast("Ce fichier n'est pas une sauvegarde Catxpo");return}
    const n=Object.keys(items).filter(k=>byKey[k]&&items[k].status).length;
    const when=d.exported?` du ${new Date(d.exported).toLocaleDateString("fr-BE")}`:"";
    const nc=d.elevage&&Array.isArray(d.elevage.cats)?d.elevage.cats.length:0;
    if(!confirm(`Importer la sauvegarde${when} (${n} expo${n>1?"s":""}${nc?`, ${nc} chat${nc>1?"s":""}`:""}) ?\nLe planning${d.elevage?" et l'élevage":""} de cet appareil seront remplacés.`))return;
    PLAN=items;if(d.photos&&typeof d.photos==="object")for(const[id,src]of Object.entries(d.photos)){if(typeof src==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(src)&&src.length<8e6)photoPut(String(id).slice(0,40),src)}if(d.elevage){ELEV=normElev(d.elevage);try{localStorage.setItem("polyexpo-elevage",JSON.stringify(ELEV))}catch(e){}}
    if(d.home&&typeof d.home.la==="number"&&d.home.q){HOME={...d.home,n:"Chez moi",home:true};try{localStorage.setItem("polyexpo-home",JSON.stringify(HOME))}catch(e){}if(DEP.home){DEP=HOME;applyDep()}}
    savePlan();render();toast(`Sauvegarde importée : ${n} expo${n>1?"s":""}`)}
}
// ---------- lien d'import (sauvegarde rangée dans le lien, après le #, jamais envoyée au serveur) ----------
const LINK_BASE="https://papybeepbeep-rgb.github.io/catxpo/";
const b64u=u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function packBackup(txt){const raw=new TextEncoder().encode(txt);
  if(window.CompressionStream){try{const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());return "z"+b64u(z)}catch(e){}}
  return "j"+b64u(raw)}
async function unpackBackup(s){const u=unb64u(s.slice(1));
  if(s[0]==="z"){const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();return JSON.parse(t)}
  return JSON.parse(new TextDecoder().decode(u))}
async function importFromText(t){const m=String(t||"").match(/#import=([\w-]+)/);if(!m){toast("Ce n'est pas un lien d'import Catxpo");return false}
  try{const d=await unpackBackup(m[1]);applyBackup(d);return true}catch(e){toast("Ce lien d'import est abîmé : demande un nouvel envoi");return false}}
async function openPaste(){const box=$("#pasteBox");if(!box)return;box.hidden=false;const inp=$("#pasteIn");
  try{if(navigator.clipboard&&navigator.clipboard.readText){const t=await navigator.clipboard.readText();if(/#import=/.test(t)){inp.value=t.trim()}}}catch(e){}
  inp.focus();}
async function importFromLink(){const m=location.hash.match(/^#import=([\w-]+)$/);if(!m)return;
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  try{const d=await unpackBackup(m[1]);view="plan";render();applyBackup(d)}catch(e){toast("Ce lien d'import est abîmé : demande un nouvel envoi")}}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-bk]");if(!b)return;if(b.dataset.bk==="export")exportBackup();else{const f=$("#bkFile");if(f){f.value="";f.click()}}});
document.addEventListener("click",async e=>{if(e.target&&e.target.closest&&e.target.closest("#pasteGo")){const v=$("#pasteIn").value;if(!v.trim()){toast("Colle d'abord le lien");return}await importFromText(v)}});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="bkFile")importBackup(e.target.files&&e.target.files[0])});
if(STANDALONE)document.body.classList.add("standalone");
// bouton « retour » d'Android : ferme la fiche au lieu de quitter l'app
(()=>{const sc=$("#scrim");let pushed=false;
  new MutationObserver(()=>{if(!sc.hidden&&!pushed){pushed=true;history.pushState({catxpo:1},"")}else if(sc.hidden&&pushed){pushed=false;if(history.state&&history.state.catxpo)history.back()}}).observe(sc,{attributes:true,attributeFilter:["hidden"]});
  addEventListener("popstate",()=>{if(pushed&&!sc.hidden){pushed=false;closeSheet()}});})();
if("serviceWorker"in navigator&&location.protocol==="https:")addEventListener("load",()=>{let r0=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(r0){r0=false;location.reload()}});navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{})});
render();importFromLink();addEventListener("hashchange",importFromLink);
</script>
